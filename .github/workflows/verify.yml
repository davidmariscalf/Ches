name: Verify public Ches certificates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -e ".[test]"
      - name: Run all adversarial verification tests
        run: python -m pytest -q
      - name: Prove a bounded forced white win and verify its full tree
        run: |
          python -m ches.cli analyze --fen '7k/Q7/8/6K1/8/8/8/1R6 w - - 0 1' --depth 1 --out mate.json > mate-summary.json
          python -m ches.cli verify mate.json
          python - <<'PY'
          import json
          p=json.load(open('mate.json'))
          assert p['bounds']==[1,1]
          assert p['unknown_leaves']>0
          print('Exact ancestor win with UNKNOWN siblings: PASS')
          PY
      - name: Independently verify that ordinary starting chess remains UNKNOWN
        run: |
          python -m ches.cli analyze --depth 2 --max-nodes 1000 --out initial.json > root-summary.json
          python -m ches.cli verify initial.json
          python - <<'PY'
          import json
          p=json.load(open('initial.json'))
          assert p['bounds']==[-1,1]
          assert p['unknown_leaves']==400
          print('Ordinary starting chess has no exact outcome certificate: PASS')
          PY
      - name: Archive reproducible JSON certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ches-verified-bounded-certificates
          if-no-files-found: ignore
          retention-days: 30
          path: |
            mate.json
            mate-summary.json
            initial.json
            root-summary.json
