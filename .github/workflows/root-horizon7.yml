name: Exact root mate horizon 7
on:
  push:
    paths:
      - 'ches/mate_horizon.py'
      - 'research/root_horizon7.py'
      - '.github/workflows/root-horizon7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Build and independently replay exact 7-ply no-forced-mate certificate
        run: |
          python research/root_horizon7.py --plies 7 --max-nodes 1000000 --output root-horizon7.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-horizon-seven-plies
          path: root-horizon7.json.gz
          retention-days: 30
          if-no-files-found: ignore
