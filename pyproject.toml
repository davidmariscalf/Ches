[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ches-adversarial-chess"
version = "0.1.0"
description = "Auditable finite-horizon minimax chess proof research"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ches-proof = "ches.cli:run"
ches-selective = "ches.threshold_cli:run"

[tool.setuptools.packages.find]
include = ["ches*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
